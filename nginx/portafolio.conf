server {
    listen 80;
    server_name prtf.slscode.online portafolio.slscode.online;

    server_tokens off;

    # ── Headers de seguridad ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header X-XSS-Protection       "1; mode=block"                 always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Nota: Strict-Transport-Security (HSTS) es agregado automáticamente
    # por Certbot al bloque SSL (puerto 443) que él genera.

    # ── Portafolio estático (contenedor Docker puerto 8896) ───────
    location / {
        proxy_pass         http://127.0.0.1:8896;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Cache de assets estáticos ─────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        proxy_pass       http://127.0.0.1:8896;
        proxy_set_header Host $host;
        expires          30d;
        add_header       Cache-Control "public, immutable";
    }
}
